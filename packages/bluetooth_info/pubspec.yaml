name: bluetooth_info
description: "Kotlin platform channel ile Bluetooth adaptör bilgilerini okuyan Flutter eklentisi."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.bluetooth_info
        pluginClass: BluetoothInfoPlugin
